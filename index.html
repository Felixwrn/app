<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{

color:white;

justify-content:center;

height:100vh;
font-family:sans-serif;

}

.glow{

}

}

button{

}

</head>

<body>

<div class="glow"></div>
