<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRNlabs NØCTIS Map</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
    color:white;
}

/* Hintergrund Grid */
.grid{
    position:absolute;
    width:100%;
    height:100%;
    background-image:
    linear-gradient(rgba(124,58,237,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,58,237,0.08) 1px, transparent 1px);
    background-size:40px 40px;
}

/* Header */
.header{
    position:absolute;
    top:20px;
    left:30px;
    z-index:10;
}

.header h1{
    margin:0;
    font-size:36px;
    letter-spacing:2px;
}

.header p{
    margin-top:5px;
    color:#888;
}

/* Live Status */
.status{
    position:absolute;
    top:30px;
    right:30px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:10;
}

.dot{
    width:12px;
    height:12px;
    background:#00ff88;
    border-radius:50%;
    box-shadow:0 0 20px #00ff88;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:0.3;}
    100%{opacity:1;}
}

/* Map Bereich */
.map{
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    border:2px solid rgba(124,58,237,0.5);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    overflow:hidden;
}

/* Radar Kreis */
.ring{
    position:absolute;
    border:1px solid rgba(124,58,237,0.4);
    border-radius:50%;
}

.r1{
    width:200px;
    height:200px;
    top:250px;
    left:250px;
}

.r2{
    width:400px;
    height:400px;
    top:150px;
    left:150px;
}

.r3{
    width:600px;
    height:600px;
    top:50px;
    left:50px;
}

/* Scan Linie */
.scan{
    position:absolute;
    width:350px;
    height:2px;
    background:linear-gradient(to right,#7c3aed,transparent);
    top:349px;
    left:350px;
    transform-origin:left center;
    animation:rotate 4s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* Fake LiDAR Punkte */
.point{
    position:absolute;
    width:6px;
    height:6px;
    background:#00ffcc;
    border-radius:50%;
    box-shadow:0 0 10px #00ffcc;
}

/* Fahrzeug */
.car{
    position:absolute;
    width:18px;
    height:18px;
    background:#ff0044;
    border-radius:50%;
    top:341px;
    left:341px;
    box-shadow:0 0 20px #ff0044;
}

/* Info Box */
.info{
    position:absolute;
    bottom:30px;
    left:30px;
    background:rgba(15,15,15,0.9);
    border:1px solid rgba(124,58,237,0.3);
    border-radius:20px;
    padding:20px;
    width:260px;
    backdrop-filter:blur(10px);
}

.info h2{
    margin-top:0;
}

.info p{
    color:#aaa;
    margin:8px 0;
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="header">
    <h1>WRNlabs</h1>
    <p>Project NØCTIS</p>
</div>

<div class="status">
    <div class="dot"></div>
    <span>SYSTEM ONLINE</span>
</div>

<div class="map">

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>

    <div class="scan"></div>

    <!-- Fake Punkte -->
    <div class="point" style="top:120px;left:220px;"></div>
    <div class="point" style="top:180px;left:520px;"></div>
    <div class="point" style="top:400px;left:620px;"></div>
    <div class="point" style="top:540px;left:180px;"></div>
    <div class="point" style="top:300px;left:90px;"></div>
    <div class="point" style="top:250px;left:580px;"></div>
    <div class="point" style="top:600px;left:350px;"></div>

    <!-- Fahrzeug -->
    <div class="car"></div>

</div>

<div class="info">
    <h2>Navigation Status</h2>

    <p>LiDAR: ACTIVE</p>
    <p>Mapping: RUNNING</p>
    <p>Obstacle Detection: STANDBY</p>
    <p>Battery: 84%</p>
</div>
<script>

let timeout;

function resetTimer(){

    clearTimeout(timeout);

    timeout = setTimeout(() => {

        window.location.href = "index.html";

    }, 60000); // 60 Sekunden

}

// Benutzeraktivität erkennen
document.addEventListener("mousemove", resetTimer);
document.addEventListener("click", resetTimer);
document.addEventListener("touchstart", resetTimer);
document.addEventListener("keydown", resetTimer);

// Start Timer
resetTimer();

</script>
</body>
</html>
